# 复制为 application.local.yml 后按本机情况修改。
# application.local.yml 已被 .gitignore 忽略，不要提交真实密钥。

server:
  host: ${AI_SERVICE_HOST:127.0.0.1}
  port: ${AI_SERVICE_PORT:8090}
  reload: ${AI_SERVICE_RELOAD:true}

llm:
  # I/O 密集型在线模型调用的进程级线程数，本机可按账号配额和网络容量调整。
  io-max-workers: ${LLM_IO_MAX_WORKERS:16}

storage:
  # 本地开发默认写 uploads/rag；生产切换为 oss 并补齐下方环境变量。
  provider: ${EVIDENCE_STORAGE_PROVIDER:local}
  local-root: ${EVIDENCE_UPLOAD_ROOT:uploads/rag}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    object-prefix: ${ALIYUN_OSS_OBJECT_PREFIX:learning-evidence}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}

rag:
  embedding:
    max-in-flight: ${RAG_EMBEDDING_MAX_IN_FLIGHT:16}
  retrieval:
    io-workers: ${RAG_RETRIEVAL_IO_WORKERS:16}
  index:
    chunk-workers: ${RAG_INDEX_CHUNK_WORKERS:9}
  kafka:
    worker:
      handler-concurrency: ${RAG_KAFKA_HANDLER_CONCURRENCY:9}
      control-concurrency: ${RAG_KAFKA_CONTROL_CONCURRENCY:16}
  # 可按本机数据分布覆盖融合和无百炼时的本地重排权重。
  fusion:
    strategy: ${RAG_FUSION_STRATEGY:weighted_rrf}
    original-query-weight: ${RAG_FUSION_ORIGINAL_QUERY_WEIGHT:1.2}
    score-blend: ${RAG_FUSION_SCORE_BLEND:0.15}
  local-rerank:
    fusion-weight: ${RAG_LOCAL_RERANK_FUSION_WEIGHT:0.40}
    lexical-weight: ${RAG_LOCAL_RERANK_LEXICAL_WEIGHT:0.35}
    title-weight: ${RAG_LOCAL_RERANK_TITLE_WEIGHT:0.15}
    rank-weight: ${RAG_LOCAL_RERANK_RANK_WEIGHT:0.10}
  # 回答准入默认偏保守；只有评测集证明召回损失可接受时再下调。
  answer-guard:
    min-top-score-dashscope: ${RAG_ANSWER_MIN_TOP_SCORE_DASHSCOPE:0.55}
  text-correction:
    # auto 表示存在 DASHSCOPE_API_KEY 时启用；离线开发可显式设为 false。
    enabled: ${RAG_TEXT_CORRECTION_ENABLED:auto}
    model: ${RAG_TEXT_CORRECTION_MODEL:qwen-plus}
    batch-max-items: ${RAG_TEXT_CORRECTION_BATCH_MAX_ITEMS:32}
    batch-max-chars: ${RAG_TEXT_CORRECTION_BATCH_MAX_CHARS:12000}
    min-similarity: ${RAG_TEXT_CORRECTION_MIN_SIMILARITY:0.55}

review:
  llm:
    # 只在用户环境变量中配置 REVIEW_LLM_API_KEY；请求默认走本机 OpenAI-compatible 中转。
    model: ${REVIEW_LLM_MODEL:gpt-5.6-terra}
    reasoning-effort: ${REVIEW_LLM_REASONING_EFFORT:max}
    thinking-enabled: ${REVIEW_LLM_THINKING_ENABLED:true}
    base-url: ${REVIEW_LLM_BASE_URL:http://localhost:58966/v1}
    api-key: ${REVIEW_LLM_API_KEY:}
    fallback:
      enabled: ${REVIEW_LLM_FALLBACK_ENABLED:true}
      model: ${REVIEW_LLM_FALLBACK_MODEL:deepseek-v4-flash}
      base-url: ${REVIEW_LLM_FALLBACK_BASE_URL:https://api.deepseek.com}
      api-key: ${REVIEW_LLM_FALLBACK_API_KEY:}
    timeout-seconds: ${REVIEW_EXTRACTION_TIMEOUT_SECONDS:615}
    max-in-flight: ${REVIEW_DEEPSEEK_MAX_IN_FLIGHT:16}
    cockpit:
      retry-enabled: ${REVIEW_COCKPIT_RETRY_ENABLED:true}
      stream-open-timeout-seconds: ${REVIEW_COCKPIT_STREAM_OPEN_TIMEOUT_SECONDS:180}
      stream-idle-timeout-seconds: ${REVIEW_COCKPIT_STREAM_IDLE_TIMEOUT_SECONDS:240}
      bootstrap-retries: ${REVIEW_COCKPIT_BOOTSTRAP_RETRIES:1}
      request-retries: ${REVIEW_COCKPIT_REQUEST_RETRIES:1}
      retry-base-delay-ms: ${REVIEW_COCKPIT_RETRY_BASE_DELAY_MS:300}
      retry-max-delay-ms: ${REVIEW_COCKPIT_RETRY_MAX_DELAY_MS:1500}
      keepalive-seconds: ${REVIEW_COCKPIT_KEEPALIVE_SECONDS:15}
  segment:
    timeout-seconds: ${REVIEW_SEGMENT_TIMEOUT_SECONDS:1800}
    request-timeout-seconds: ${REVIEW_SEGMENT_REQUEST_TIMEOUT_SECONDS:240}
    cockpit-request-retries: ${REVIEW_SEGMENT_COCKPIT_REQUEST_RETRIES:0}
    max-generation-attempts: ${REVIEW_SEGMENT_MAX_GENERATION_ATTEMPTS:3}
    max-merge-rounds: ${REVIEW_SEGMENT_MAX_MERGE_ROUNDS:2}
  langextract:
    enabled: ${REVIEW_LANGEXTRACT_ENABLED:true}
    extraction-passes: ${REVIEW_LANGEXTRACT_EXTRACTION_PASSES:2}
    max-char-buffer: ${REVIEW_LANGEXTRACT_MAX_CHAR_BUFFER:8000}
    max-workers: ${REVIEW_LANGEXTRACT_MAX_WORKERS:9}
    max-model-requests: ${REVIEW_LANGEXTRACT_MAX_MODEL_REQUESTS:32}
    timeout-seconds: ${REVIEW_LANGEXTRACT_TIMEOUT_SECONDS:615}

workers:
  outbox:
    publish-concurrency: ${RAG_OUTBOX_PUBLISH_CONCURRENCY:16}
  agent:
    batch-size: ${AGENT_WORKER_BATCH_SIZE:16}
    concurrency: ${AGENT_WORKER_CONCURRENCY:16}
  rag-task:
    concurrency: ${RAG_TASK_WORKER_CONCURRENCY:9}
  review-sync:
    max-workers: ${RAG_REVIEW_SYNC_WORKERS:16}
  review-task:
    enabled: ${REVIEW_TASK_WORKER_ENABLED:true}
    poll-seconds: ${REVIEW_TASK_WORKER_POLL_SECONDS:2}
    batch-size: ${REVIEW_TASK_WORKER_BATCH_SIZE:16}
    concurrency: ${REVIEW_TASK_WORKER_CONCURRENCY:16}
    stale-seconds: ${REVIEW_TASK_WORKER_STALE_SECONDS:1200}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

mineru:
  # 示例：command: "mineru -p {input} -o {output}"
  command: ${MINERU_COMMAND:}
  token: ${MINERU_TOKEN:}
  api-token: ${MINERU_API_TOKEN:}
  api-key: ${MINERU_API_KEY:}

remote-video:
  douyin:
    # 在用户环境变量中设置 SOCIALDATAX_API_KEY；不要把真实密钥提交到仓库。
    enabled: ${RAG_DOUYIN_MCP_ENABLED:true}
    mcp-endpoint: ${RAG_DOUYIN_MCP_ENDPOINT:https://mcp.52choujiang.com/douyin/mcp}
    api-key: ${SOCIALDATAX_API_KEY:}
    connection-timeout-seconds: ${RAG_DOUYIN_MCP_CONNECTION_TIMEOUT_SECONDS:30}
    tool-timeout-seconds: ${RAG_DOUYIN_MCP_TOOL_TIMEOUT_SECONDS:60}
    poll-interval-seconds: ${RAG_DOUYIN_TRANSCRIPT_POLL_INTERVAL_SECONDS:5}
    max-wait-seconds: ${RAG_DOUYIN_TRANSCRIPT_MAX_WAIT_SECONDS:900}

video:
  parallel-workers: ${RAG_VIDEO_PARALLEL_WORKERS:9}
  # 未加入 PATH 时可填完整路径，例如 C:\ffmpeg\bin\ffmpeg.exe。
  ffmpeg-command: ${FFMPEG_COMMAND:}
  ffprobe-command: ${FFPROBE_COMMAND:}

document:
  convert:
    # 未加入 PATH 时可填完整路径，例如 C:\Program Files\LibreOffice\program\soffice.exe。
    libreoffice-command: ${LIBREOFFICE_COMMAND:}
    soffice-command: ${SOFFICE_COMMAND:}

environment:
  # 离线演示时可取消下面三项注释；真实联调建议使用默认的 pgvector + 百炼。
  # RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:hash}
  # RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:local}
  # RAG_ANSWER_PROVIDER: ${RAG_ANSWER_PROVIDER:local}
